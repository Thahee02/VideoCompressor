services:
  # ─── 1. Django + FFmpeg Backend — Native Python ───
  - type: web
    name: videopress-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --log-level info
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://videopress-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ─── 2. React + Vite Frontend Static Site ───
  - type: web
    name: videopress-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://videopress-backend.onrender.com"
